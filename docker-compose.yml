services:
  jekyll:
    image: ruby:3.3
    working_dir: /srv/jekyll
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    ports:
      - "4000:4000"
      - "35729:35729"
    command: >
      bash -c "bundle install &&
      bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"

volumes:
  bundle_cache: